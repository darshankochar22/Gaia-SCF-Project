[package]
name = "anchor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = "0.8"
dotenvy = "0.15.7"
ed25519-dalek = "2"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.4"
serde_json = "1.0.154"
sha2 = "0.11.1"
stellar-rpc-client = "30"
stellar-strkey = "1"
stellar-xdr = { version = "30", features = ["std", "base64", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace]
